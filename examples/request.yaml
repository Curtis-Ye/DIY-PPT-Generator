# ============================================================
# 用户需求配置 — 修改此文件来控制 PPT 生成效果
# ============================================================

# 目标 PPT 页数（包含封面和结束页）
# 可选范围: 8~30，建议 12~18
page_count: 15

# 文档路径（相对于 skill 根目录）
# 例如: examples/input.docx
document: examples/input.docx

# 演示文稿信息
meta:
  title: ""           # 留空则自动从文档提取
  subtitle: ""        # 副标题，如"硕士学位论文答辩"
  author: ""          # 作者名
  date: ""            # 留空则使用当前日期

# 主题选择: blue / dark / green
theme: blue

# 特殊要求（可选）
# 例如: "多放架构图"、"弱化公式推导"、"重点突出实验结果"
notes: ""
