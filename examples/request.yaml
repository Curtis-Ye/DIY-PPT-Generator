# ============================================================
# 用户需求配置 — 修改此文件来控制 PPT 生成效果
# ============================================================

# 目标 PPT 页数（包含封面和结束页）
# 范围: 8~30，建议 12~18
page_count: 15

# 文档路径（相对于 skill 根目录）
document: examples/input.docx

# PPT 模板（留空 = 使用内置样式）
# 将你的 .pptx 模板放入 templates/ 目录，在此填写文件名
# 例如: template: templates/公司模板.pptx
template: ""

# 演示文稿信息
meta:
  title: ""           # 留空则自动从文档提取
  subtitle: ""        # 副标题，如"硕士学位论文答辩"
  author: ""          # 作者名
  date: ""            # 留空则使用当前日期

# 主题: blue / dark / green（使用模板时此项被模板覆盖）
theme: blue

# 字体自定义（选填，留空使用 config.yaml 默认值）
# 如需自定义，取消注释并修改
# font:
#   cover_title: 微软雅黑
#   heading: 黑体
#   body: 宋体

# 特殊要求（可选）
notes: ""
